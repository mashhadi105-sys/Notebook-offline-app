<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--cd:#1c2523;--tx:#e8efed;--mu:#93a19e;--ac:#2dd4bf;--bd:#2c3835;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121816;--cd:#1c2523;--tx:#e8efed;--mu:#93a19e;--ac:#2dd4bf;--bd:#2c3835;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Naskh Arabic",system-ui,sans-serif;font-size:17px;line-height:1.7}
button,input,textarea,select{font:inherit;color:inherit}
.bar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar h1{flex:1;margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar input.t{flex:1;min-width:0;border:0;background:none;font-weight:600;font-size:18px;outline:0}
.ib{border:1px solid var(--bd);background:var(--bg);border-radius:10px;min-width:40px;height:40px;cursor:pointer;font-size:16px}
.wrap{padding:12px;max-width:720px;margin:auto}
.srch{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);margin-bottom:8px;outline:0}
.crumb{font-size:14px;color:var(--mu);margin:4px 2px 10px;overflow-x:auto;white-space:nowrap}
.crumb a{color:var(--ac);cursor:pointer}
.row{display:flex;align-items:center;gap:12px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.row .ic{font-size:26px}.row .m{flex:1;min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:20px;width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 4px 14px #0004;cursor:pointer}
:root[data-theme="dark"] .fab{color:#06201c}
.sheet{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--cd);width:100%;border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:720px;margin:auto}
.sheet button{display:block;width:100%;text-align:start;border:0;background:none;padding:13px 8px;border-bottom:1px solid var(--bd);cursor:pointer}
textarea.b{width:100%;min-height:calc(100vh - 170px);border:0;background:none;resize:none;outline:0;padding:14px;line-height:1.9}
.empty{text-align:center;color:var(--mu);padding:50px 10px}
.fld{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);margin-bottom:8px}
canvas{width:100%;border-radius:12px;border:1px solid var(--bd)}
.pr{display:flex;gap:8px;margin:8px 0}.pr button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);cursor:pointer}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 18px;border-radius:20px;z-index:30;font-size:15px}
</style></head><body><div id="app"></div>
<script>
const T={ur:{app:"میری نوٹ بک",srch:"تلاش کریں…",nf:"📁 نیا فولڈر",nn:"📝 نیا نوٹ / پرامپٹ",af:"📄 فائل شامل کریں (کوئی بھی قسم)",nc:"📊 نیا چارٹ",emp:"ابھی کچھ نہیں ہے۔ + دبا کر شروع کریں۔",fn:"فولڈر کا نام",un:"بغیر عنوان",cp:"کاپی",sh:"شیئر",del:"حذف",ren:"نام بدلیں",cpd:"کاپی ہو گیا",cd:"یہ آئٹم ہمیشہ کے لیے حذف ہو جائے گا؟",op:"کھولیں / ڈاؤنلوڈ",ex:"💾 بیک اپ بنائیں",im:"📥 بیک اپ بحال کریں",lg:"🌐 English",th:"🌓 تھیم بدلیں",ch:"حروف",ti:"عنوان",ds:"ہر سطر: نام، قدر (مثلاً جنوری، 50)",bar:"بار",line:"لائن",pie:"پائی",fo:"فولڈر",ok:"ہو گیا",info:"تمام فائلیں اور تحریریں اس ایپ کی اپنی محفوظ کاپی ہیں۔ فون سے ڈیلیٹ کرنے پر بھی یہاں رہیں گی۔ احتیاط کے لیے وقتاً فوقتاً بیک اپ بنائیں۔",mv:"منتقل کریں"},
en:{app:"My Notebook",srch:"Search…",nf:"📁 New folder",nn:"📝 New note / prompt",af:"📄 Add file (any type)",nc:"📊 New chart",emp:"Nothing here yet. Tap + to start.",fn:"Folder name",un:"Untitled",cp:"Copy",sh:"Share",del:"Delete",ren:"Rename",cpd:"Copied",cd:"Delete this item permanently?",op:"Open / Download",ex:"💾 Create backup",im:"📥 Restore backup",lg:"🌐 اردو",th:"🌓 Switch theme",ch:"chars",ti:"Title",ds:"One per line: label, value (e.g. Jan, 50)",bar:"Bar",line:"Line",pie:"Pie",fo:"Folder",ok:"Done",info:"All files and text are the app's own saved copy and stay here even if deleted from your phone. Make a backup now and then to be safe.",mv:"Move"}};
let L='ur';try{L=localStorage.getItem('nbl')||'ur'}catch(_){}
const t=k=>T[L][k]||k,$=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let db=null,items=[],cur=null,ed=null,q='',mem=false;
function idb(){return new Promise(r=>{try{const o=indexedDB.open('nb',1);o.onupgradeneeded=()=>o.result.createObjectStore('i',{keyPath:'id'});o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(_){r(null)}})}
function put(it){if(!db)return;try{db.transaction('i','readwrite').objectStore('i').put(it)}catch(_){}}
function rm(id){if(!db)return;try{db.transaction('i','readwrite').objectStore('i').delete(id)}catch(_){}}
function load(){return new Promise(r=>{if(!db)return r([]);const g=db.transaction('i').objectStore('i').getAll();g.onsuccess=()=>r(g.result);g.onerror=()=>r([])})}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function mk(type,x){const it={id:uid(),type,parent:cur,title:'',body:'',ts:Date.now(),...x};items.push(it);put(it);return it}
function crumbs(){let a=[],id=cur;while(id){const f=items.find(x=>x.id==id);if(!f)break;a.unshift(f);id=f.parent}return a}
const ICON={folder:'📁',note:'📝',pdf:'📄',file:'📎',chart:'📊'};
const dt=ts=>new Date(ts).toLocaleDateString(L=='ur'?'ur-PK':'en-GB');
function render(){document.documentElement.lang=L;document.documentElement.dir=L=='ur'?'rtl':'ltr';
 if(ed&&ed.type=='note')return noteView();if(ed&&ed.type=='chart')return chartView();
 const c=crumbs(),cf=c[c.length-1];
 $('#app').innerHTML=`<div class="bar">${cur?`<button class="ib" onclick="up()">${L=='ur'?'→':'←'}</button>`:''}<h1>${e(cf?cf.title:t('app'))}</h1><button class="ib" onclick="menu()">⋯</button></div>
 <div class="wrap"><input class="srch" id="sq" placeholder="${t('srch')}" value="${e(q)}" oninput="q=this.value;lst()">
 <div class="crumb"><a onclick="go(null)">🏠</a>${c.map(f=>` / <a onclick="go('${f.id}')">${e(f.title)}</a>`).join('')}</div><div id="lst"></div></div>
 <button class="fab" onclick="addMenu()">+</button>`;lst()}
function lst(){let r=q?items.filter(x=>(x.title+' '+(x.type=='note'?x.body:'')).toLowerCase().includes(q.toLowerCase())):items.filter(x=>x.parent==cur);
 r.sort((a,b)=>(b.type=='folder')-(a.type=='folder')||b.ts-a.ts);
 $('#lst').innerHTML=r.length?r.map(x=>`<div class="row" onclick="openIt('${x.id}')"><span class="ic">${ICON[x.type]}</span><span class="m"><b>${e(x.title||t('un'))}</b><small>${x.type=='note'?e((x.body||'').slice(0,60)):dt(x.ts)}</small></span><button class="ib" onclick="event.stopPropagation();itMenu('${x.id}')">⋮</button></div>`).join(''):`<div class="empty">${t('emp')}</div>`}
function go(id){cur=id;ed=null;q='';render()}
function up(){const f=items.find(x=>x.id==cur);go(f?f.parent:null)}
function openIt(id){const x=items.find(i=>i.id==id);if(x.type=='folder')return go(id);if(x.type=='pdf'||x.type=='file')return fileAct(x);ed=x;render()}
function sheet(h){const s=document.createElement('div');s.className='sheet';s.onclick=ev=>{if(ev.target==s)s.remove()};s.innerHTML='<div>'+h+'</div>';document.body.appendChild(s);return s}
function cl(){document.querySelector('.sheet')?.remove()}
function addMenu(){sheet(`<button onclick="cl();newFolder()">${t('nf')}</button><button onclick="cl();newNote()">${t('nn')}</button><button onclick="cl();$('#fi').click()">${t('af')}</button><button onclick="cl();newChart()">${t('nc')}</button><input id="fi" type="file" multiple hidden onchange="addFiles(this.files)">`)}
function newFolder(){const n=prompt(t('fn'));if(n){mk('folder',{title:n});render()}}
function newNote(){ed=mk('note',{});render()}
function newChart(){ed=mk('chart',{kind:'bar',body:'A, 30\nB, 55\nC, 40'});render()}
async function addFiles(fs){for(const f of fs){if(/\.txt$/i.test(f.name)||f.type=='text/plain')mk('note',{title:f.name.replace(/\.txt$/i,''),body:await f.text()});else mk('file',{title:f.name,blob:new Blob([await f.arrayBuffer()],{type:f.type||'application/octet-stream'}),size:f.size})}render()}
function fileAct(x){const u=URL.createObjectURL(x.blob);sheet(`<button onclick="window.open('${u}','_blank');cl()">${t('op')}</button><button onclick="shareFile('${x.id}');cl()">${t('sh')}</button>`)}
async function shareFile(id){const x=items.find(i=>i.id==id),f=new File([x.blob],x.title,{type:x.blob.type});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:x.title});else toast('—')}catch(_){}}
function itMenu(id){const x=items.find(i=>i.id==id);const fo=items.filter(f=>f.type=='folder'&&f.id!=id);sheet(`<button onclick="ren('${id}')">✏️ ${t('ren')}</button><button onclick="mvMenu('${id}')">📂 ${t('mv')}</button><button onclick="delIt('${id}')" style="color:#dc2626">🗑 ${t('del')}</button>`)}
function mvMenu(id){cl();const fo=items.filter(f=>f.type=='folder'&&f.id!=id&&!isIn(f.id,id));sheet(`<button onclick="mv('${id}',null)">🏠</button>`+fo.map(f=>`<button onclick="mv('${id}','${f.id}')">📁 ${e(f.title)}</button>`).join(''))}
function isIn(a,b){let x=items.find(i=>i.id==a);while(x){if(x.id==b)return true;x=items.find(i=>i.id==x.parent)}return false}
function mv(id,p){const x=items.find(i=>i.id==id);x.parent=p;put(x);cl();render()}
function ren(id){cl();const x=items.find(i=>i.id==id),n=prompt(t('ti'),x.title);if(n!=null){x.title=n;put(x);render()}}
function delIt(id){cl();if(!confirm(t('cd')))return;const kill=i=>{items.filter(x=>x.parent==i).forEach(c=>kill(c.id));items=items.filter(x=>x.id!=i);rm(i)};kill(id);render()}
function menu(){sheet(`<button onclick="cl();tg()">${t('lg')}</button><button onclick="cl();th()">${t('th')}</button><button onclick="cl();exp()">${t('ex')}</button><button onclick="cl();$('#ii').click()">${t('im')}</button><input id="ii" type="file" accept=".json" hidden onchange="imp(this.files[0])"><p style="color:var(--mu);font-size:14px;margin:10px 4px 0">${t('info')}</p>`)}
function tg(){L=L=='ur'?'en':'ur';try{localStorage.setItem('nbl',L)}catch(_){}render()}
function th(){const d=document.documentElement,dk=getComputedStyle(d).colorScheme=='dark';d.dataset.theme=dk?'light':'dark'}
function saveTxt(){if(!ed)return;ed.ts=Date.now();clearTimeout(saveTxt.h);saveTxt.h=setTimeout(()=>put(ed),250)}
function noteView(){$('#app').innerHTML=`<div class="bar"><button class="ib" onclick="closeEd()">${L=='ur'?'→':'←'}</button><input class="t" id="ti" placeholder="${t('ti')}" value="${e(ed.title)}" oninput="ed.title=this.value;saveTxt()"><button class="ib" onclick="cpTxt()">📋</button><button class="ib" onclick="shTxt()">↗</button></div><textarea class="b" id="bd" dir="auto" oninput="ed.body=this.value;saveTxt();$('#cc').textContent=this.value.length+' '+t('ch')">${e(ed.body)}</textarea><div class="wrap" style="color:var(--mu);font-size:13px" id="cc">${(ed.body||'').length} ${t('ch')}</div>`}

async function cpTxt(){try{await navigator.clipboard.writeText(ed.body||'')}catch(_){const a=$('#bd');a.select();document.execCommand('copy')}toast(t('cpd'))}
async function shTxt(){try{if(navigator.share)await navigator.share({title:ed.title,text:ed.body});else cpTxt()}catch(_){}}
const COL=['#0f766e','#d97706','#7c3aed','#dc2626','#2563eb','#16a34a','#db2777','#64748b'];
function parse(s){return(s||'').split('\n').map(l=>{const m=l.match(/^(.*?)[,:،\t]\s*(-?[\d.]+)\s*$/);return m?{l:m[1].trim(),v:parseFloat(m[2])}:null}).filter(Boolean)}
function draw(cv,ch){const x=cv.getContext('2d'),W=cv.width=640,H=cv.height=380,dk=getComputedStyle(document.documentElement).colorScheme=='dark',fg=dk?'#e8efed':'#1d2b2a';
 x.fillStyle=dk?'#1c2523':'#fff';x.fillRect(0,0,W,H);x.fillStyle=fg;x.textAlign='center';x.font='600 20px "Noto Naskh Arabic",sans-serif';x.fillText(ch.title||'',W/2,30);
 const d=parse(ch.body);if(!d.length)return;x.font='14px "Noto Naskh Arabic",sans-serif';
 if(ch.kind=='pie'){const s=d.reduce((a,b)=>a+Math.max(b.v,0),0)||1;let a0=-Math.PI/2;d.forEach((p,i)=>{const a=Math.max(p.v,0)/s*Math.PI*2;x.fillStyle=COL[i%8];x.beginPath();x.moveTo(190,215);x.arc(190,215,125,a0,a0+a);x.fill();a0+=a;x.fillRect(360,70+i*26,14,14);x.fillStyle=fg;x.textAlign='left';x.fillText(p.l+' ('+Math.round(p.v/s*100)+'%)',382,82+i*26)});return}
 const mx=Math.max(...d.map(p=>p.v),1),x0=40,x1=W-20,y0=H-50,y1=65,w=(x1-x0)/d.length;x.strokeStyle=dk?'#2c3835':'#ddd';x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y0);x.stroke();
 const py=v=>y0-(v/mx)*(y0-y1);
 if(ch.kind=='line'){x.strokeStyle=COL[0];x.lineWidth=3;x.beginPath();d.forEach((p,i)=>{const X=x0+w*i+w/2;i?x.lineTo(X,py(p.v)):x.moveTo(X,py(p.v))});x.stroke()}
 d.forEach((p,i)=>{const X=x0+w*i+w/2;if(ch.kind=='line'){x.fillStyle=COL[0];x.beginPath();x.arc(X,py(p.v),5,0,7);x.fill()}else{x.fillStyle=COL[i%8];x.fillRect(X-w*.35,py(p.v),w*.7,y0-py(p.v))}
 x.fillStyle=fg;x.textAlign='center';x.fillText(p.v,X,py(p.v)-8);x.fillText(p.l,X,y0+22)})}
function chartView(){$('#app').innerHTML=`<div class="bar"><button class="ib" onclick="closeEd()">${L=='ur'?'→':'←'}</button><h1>${t('nc').slice(2)}</h1><button class="ib" onclick="shChart()">↗</button></div><div class="wrap"><input class="fld" dir="auto" placeholder="${t('ti')}" value="${e(ed.title)}" oninput="ed.title=this.value;upd()"><div class="pr">${['bar','line','pie'].map(k=>`<button onclick="ed.kind='${k}';upd();chartView()" style="${ed.kind==k?'border-color:var(--ac);color:var(--ac)':''}">${t(k)}</button>`).join('')}</div><canvas id="cv"></canvas><p style="color:var(--mu);font-size:14px;margin:8px 0 4px">${t('ds')}</p><textarea class="fld" dir="auto" rows="7" oninput="ed.body=this.value;upd()">${e(ed.body)}</textarea></div>`;draw($('#cv'),ed)}
function upd(){saveTxt();draw($('#cv'),ed)}
function shChart(){$('#cv').toBlob(async b=>{const f=new File([b],(ed.title||'chart')+'.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}catch(_){}})}
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function d2b(u){const[h,d]=u.split(',');const m=h.match(/:(.*?);/)[1],s=atob(d),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m})}
async function exp(){const out=[];for(const i of items){const o={...i};if(i.blob)o.blob=await b2d(i.blob);out.push(o)}const f=new File([JSON.stringify(out)],'notebook-backup.json',{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(_){}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
async function imp(f){if(!f)return;try{const a=JSON.parse(await f.text());for(const o of a){if(o.blob)o.blob=d2b(o.blob);if(!items.find(x=>x.id==o.id))items.push(o);put(o)}render();toast(t('ok'))}catch(_){toast('✗')}}
(async()=>{db=await idb();items=await load();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();

async function useTpl(){let s=ed.body||'';for(const v of new Set(s.match(/\{[^{}\n]{1,40}\}/g)||[])){const a=prompt(v);if(a===null)return;s=s.split(v).join(a)}try{await navigator.clipboard.writeText(s)}catch(_){}toast(t('cpd'))}
</script></body></html>
